<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>素材库 · Liquid Glass</title>
<style>
:root{--ink:#1d1d1f;--ink2:#3a3a3c;--sub:#6e6e73;--line:#d2d2d7;--brand:#007aff;--ok:#34c759;--bad:#ff3b30;--r-card:18px;--r-pill:999px;--r-btn:999px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.10}
.ambient i:nth-child(1){width:420px;height:420px;left:-120px;top:-100px;background:#007aff}
.ambient i:nth-child(2){width:360px;height:360px;right:-100px;top:30%;background:#af52de}
.ambient i:nth-child(3){width:380px;height:380px;left:20%;bottom:-120px;background:#34c759}
.glass,.glass-soft{position:relative;isolation:isolate;background:rgba(255,255,255,.28);backdrop-filter:saturate(200%) blur(18px) brightness(1.08);-webkit-backdrop-filter:saturate(200%) blur(18px) brightness(1.08);border-radius:var(--r-card);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06);transition:box-shadow .35s var(--ease),background .35s var(--ease),transform .35s var(--ease)}
.glass-soft{background:rgba(255,255,255,.62)}
.glass::before,.glass-soft::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:inherit;filter:url(#refractSoft);opacity:.50;pointer-events:none}
.glass::after,.glass-soft::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;border-radius:inherit;background:linear-gradient(90deg,transparent,rgba(255,255,255,.88),transparent);pointer-events:none}
.glass:active,.glass-soft:active{background:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.06);transform:scale(.98)}
.nav{position:relative;z-index:50;display:flex;align-items:center;gap:10px;margin:max(12px,env(safe-area-inset-top)) 12px 0;padding:8px 12px;border-radius:var(--r-pill);background:rgba(255,255,255,.60);backdrop-filter:saturate(166%) brightness(1.07);-webkit-backdrop-filter:saturate(166%) brightness(1.07);border:1px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.92),0 4px 18px rgba(0,0,0,.05)}
.brand{flex:0 0 auto;font-weight:700;font-size:17px;letter-spacing:-.02em;padding:0 6px;color:var(--ink);background:linear-gradient(135deg,#007aff,#af52de);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.search{position:relative;flex:1;min-width:0;display:flex;align-items:center}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.search input{width:100%;height:36px;padding:0 14px 0 36px;border:0;outline:0;font:inherit;color:var(--ink);background:rgba(243,243,248,.82);border-radius:var(--r-pill);transition:background .25s var(--ease),box-shadow .25s var(--ease)}
.search input::placeholder{color:var(--sub)}
.search input:focus{background:#fff;box-shadow:0 0 0 2px var(--brand) inset}
.seg{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;justify-content:center}
.seg-inner{position:relative;display:flex;align-items:center;gap:0;padding:5px;border-radius:var(--r-pill);background:rgba(231,231,237,.63);backdrop-filter:saturate(146%) brightness(1.06);-webkit-backdrop-filter:saturate(146%) brightness(1.06);border:1px solid rgba(255,255,255,.56);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 22px rgba(0,0,0,.06);user-select:none}
.seg-btn{flex:1;min-width:96px;height:40px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink2);background:transparent;border:0;cursor:pointer;padding:0 18px;border-radius:var(--r-pill);position:relative;z-index:2;transition:color .35s var(--ease);white-space:nowrap}
.seg-btn .lb{font-size:15px;line-height:1}
.seg-btn.active{color:var(--ink)}
.seg-pill{position:absolute;top:5px;left:5px;height:40px;border-radius:var(--r-pill);z-index:3;background:rgba(255,255,255,.085);backdrop-filter:saturate(270%) blur(16px) brightness(1.23);-webkit-backdrop-filter:saturate(270%) blur(16px) brightness(1.23);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.96),inset 0 -1px 0 rgba(0,0,0,.03),0 2px 10px rgba(0,0,0,.05);transition:left .44s var(--ease),width .43s var(--ease);pointer-events:auto;cursor:grab;touch-action:none}
.seg-pill:active,.seg-pill.dragging{cursor:grabbing;background:rgba(255,255,255,.11);transition:none}
.seg-pill::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.33),rgba(255,255,255,0));pointer-events:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;line-height:1}
.pages{position:relative;z-index:1;flex:1;min-height:0;padding:14px 0 134px;overflow:hidden}
.page{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 56px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .38s var(--ease),transform .38s var(--ease);scroll-padding-top:14px}
.page.active{opacity:1;transform:none;pointer-events:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:flex;flex-direction:column;overflow:hidden}
.card .thumb{position:relative;width:100%;aspect-ratio:1/1;background:#f2f2f7;overflow:hidden;border-radius:var(--r-card) var(--r-card) 0 0}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.card:active .thumb img{transform:scale(1.045)}
.card .badge-free{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.91);color:var(--ok);font-size:10px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.09)}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .t{font-size:13px;font-weight:700;color:var(--ink);line-height:1.3;-webkit-line-clamp:1;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.card .d{font-size:11px;color:var(--sub);line-height:1.35;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.card .row{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;height:34px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;color:var(--ink);background:rgba(236,236,242,.93);border:0;cursor:pointer;border-radius:var(--r-btn);transition:all .25s var(--ease)}
.btn:hover{background:#e1e1e7}
.btn:active{transform:scale(.955)}
.btn.primary{color:#fff;background:var(--brand);box-shadow:0 2px 8px rgba(0,122,255,.29)}
.btn.primary:hover{background:#005dc9}
.btn.added{color:#fff;background:var(--ok);box-shadow:0 2px 8px rgba(52,199,89,.29)}
.btn.dl{color:#fff;background:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 20px;text-align:center;color:var(--sub)}
.empty .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(237,237,241,.83);font-size:26px}
.empty b{color:var(--ink2);font-weight:600;font-size:15px}
.cart-list{display:flex;flex-direction:column;gap:10px}
.cart-item{display:flex;gap:12px;padding:10px;align-items:center}
.ck{width:22px;height:22px;border-radius:7px;flex:0 0 22px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all .215s var(--ease)}
.ck.on{border-color:var(--brand);background:var(--brand);box-shadow:0 2px 6px rgba(0,122,255,.225)}
.ck.on svg{color:#fff}
.cart-item .ci{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 64px;background:#f2f2f7}
.cart-item .ct{flex:1;min-width:0}
.cart-item .ct .t{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .ct .d{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .del{width:34px;height:34px;border-radius:10px;border:0;background:rgba(235,235,240,.81);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--bad);font-size:16px}
.cart-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 4px;margin-bottom:6px}
.toolbar{display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:130px;transform:translate(-50%,20px);z-index:300;padding:12px 18px;border-radius:14px;background:rgba(28,28,30,.91);color:#fff;font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.27);opacity:0;pointer-events:none;transition:opacity .34s var(--ease),transform .34s var(--ease);max-width:86vw;text-align:center;line-height:1.41}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="refractSoft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  </div>
</nav>
<main class="pages">
  <section class="page active" id="page-today" aria-label="素材库"><div class="grid" id="grid"></div></section>
  <section class="page" id="page-cart" aria-label="购物车">

    </div>
    <div class="cart-list" id="cartList"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

let CART=[]; try{CART=JSON.parse(localStorage.getItem("ml_cart")||"[]");}catch(e){CART=[];}
const $=s=>document.querySelector(s);
const el=(tag,c,h)=>{const n=document.createElement(tag);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),ms);}
function uid(){return "m_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function cartHas(id){return CART.includes(id);}
function updateCartBadge(){const b=$("#cartBadge");const n=CART.length;b.textContent=n;b.hidden=n===0;}
function saveCart(){localStorage.setItem("ml_cart",JSON.stringify(CART));updateCartBadge();}
function renderGrid(){const g=$("#grid");g.innerHTML="";const q=($("#searchInput").value||"").trim().toLowerCase();const lst=q?ITEMS.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.desc||"").toLowerCase().includes(q)):ITEMS;if(lst.length===0){const e=el("div","empty glass-soft",`<div class="ic">🖼️</div><b>${q?"无匹配素材":"暂无素材"}</b><span style="font-size:12px">${q?"换个关键词试试":"素材库为空"}</span>`);e.style.gridColumn="1 / -1";g.appendChild(e);return;}lst.forEach(it=>g.appendChild(cardNode(it)));}
function cardNode(it){const c=el("div","card glass");c.innerHTML=`<div class="thumb"><img src="${it.src}" alt="${it.title||""}" loading="lazy"><span class="badge-free">✓ 可商用·免费</span></div><div class="body"><div class="t">${it.title||"未命名素材"}</div><div class="d">${it.desc||""}</div><div class="row"><button class="btn ${cartHas(it.id)?"added":"primary"}" data-act="add" data-id="${it.id}">${cartHas(it.id)?"✓ 已添加":"加入购物车"}</button></div></div>`;return c;}
function renderCart(){const l=$("#cartList");l.innerHTML="";const its=ITEMS.filter(i=>CART.includes(i.id));$("#cartCountTxt").textContent=its.length?`共 ${its.length} 项 · 已选 ${its.filter(i=>i.selected).length} 项`:"购物车为空";if(its.length===0){l.appendChild(el("div","empty glass-soft",`<div class="ic">🛒</div><b>购物车为空</b><span style="font-size:12px">去 Today 添加喜欢的素材吧</span>`));return;}its.forEach(it=>{const n=el("div","cart-item glass-soft");n.innerHTML=`<span class="ck ${it.selected?"on":""}" data-act="toggle" data-id="${it.id}" role="checkbox" aria-checked="${!!it.selected}">${it.selected?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':""}</span><img class="ci" src="${it.src}" alt=""><div class="ct"><div class="t">${it.title||"未命名素材"}</div><div class="d">${it.desc||""}</div></div><button class="del" data-act="rm" data-id="${it.id}" aria-label="移除">🗑️</button>`;l.appendChild(n);});}
function selectedItems(){return ITEMS.filter(i=>CART.includes(i.id)&&i.selected);}
function downloadOne(it){const a=document.createElement("a");a.href=it.src;a.download=(it.title||"material").replace(/[^a-z0-9_-]+/gi,"_")+".png";document.body.appendChild(a);a.click();a.remove();}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;}
async function downloadSelected(){const s=selectedItems();if(!s.length){toast("请先勾选要下载的素材");return;}if(isIOS()){s.forEach(it=>window.open(it.src,"_blank"));toast("已打开图片，请长按图片选择「存储图像」保存到相册");}else{s.forEach((it,i)=>setTimeout(()=>downloadOne(it),i*120));toast("已开始下载 "+s.length+" 项到本地");}}
const SEG_TABS=["today","cart"];
function setTab(name){document.querySelectorAll(".seg-btn").forEach(b=>{const a=b.dataset.tab===name;b.classList.toggle("active",a);b.setAttribute("aria-current",a?"page":"false");});document.querySelectorAll(".page").forEach(p=>p.classList.toggle("active",p.id==="page-"+name));const ab=document.querySelector('.seg-btn[data-tab="'+name+'"]');if(!ab)return;const ir=$("#segInner").getBoundingClientRect(),r=ab.getBoundingClientRect();const p=$("#segPill");p.style.left=(r.left-ir.left)+"px";p.style.width=r.width+"px";}
function initSeg(){const first=document.querySelector('.seg-btn[data-tab="today"]');if(first){const ir=$("#segInner").getBoundingClientRect(),r=first.getBoundingClientRect();const p=$("#segPill");p.style.left=(r.left-ir.left)+"px";p.style.width=r.width+"px";}}
initSeg();renderGrid();renderCart();
document.getElementById("segInner").addEventListener("click",e=>{const b=e.target.closest(".seg-btn");if(b)setTab(b.dataset.tab);});
(function bindPillDrag(){const p=$("#segPill"),ir=$("#segInner");let drag=false,sX=0,bL=0;function rectOf(t){const b=document.querySelector('.seg-btn[data-tab="'+t+'"]');if(!b)return null;const r=b.getBoundingClientRect(),i=ir.getBoundingClientRect();return{left:r.left-i.left,width:r.width,center:r.left-i.left+r.width/2};}function tabAt(cx){const i=ir.getBoundingClientRect(),x=cx-i.left;let best=null,bestD=Infinity;SEG_TABS.forEach(t=>{const r=rectOf(t);if(!r)return;const d=Math.abs((r.left+r.width/2)-x);if(d<bestD){bestD=d;best=t;}});return best;}function down(e){if(e.target.closest(".seg-btn"))return;e.preventDefault();drag=true;p.classList.add("dragging");const pt=e.touches?e.touches[0]:e;sX=pt.clientX;bL=parseFloat(p.style.left)||0;}function move(e){if(!drag)return;e.preventDefault();const pt=e.touches?e.touches[0]:e,dx=pt.clientX-sX;const r0=rectOf(SEG_TABS[0]),r2=rectOf(SEG_TABS[SEG_TABS.length-1]);const minL=r0.left,maxL=r2.left+r2.width-(parseFloat(p.style.width)||40);let nl=bL+dx;nl=Math.max(minL,Math.min(nl,maxL));p.style.left=nl+"px";const t=tabAt(pt.clientX);if(t&&t!==(document.querySelector(".seg-btn.active")||{}).dataset?.tab)setTab(t);}function up(){if(!drag)return;drag=false;p.classList.remove("dragging");setTab((document.querySelector(".seg-btn.active")||{}).dataset?.tab||"today");}p.addEventListener("mousedown",down);window.addEventListener("mousemove",move);window.addEventListener("mouseup",up);p.addEventListener("touchstart",down,{passive:false});window.addEventListener("touchmove",move,{passive:false});window.addEventListener("touchend",up);})();
$("#grid").addEventListener("click",e=>{const b=e.target.closest('[data-act="add"]');if(!b)return;const id=b.dataset.id;if(!CART.includes(id)){CART.push(id);saveCart();renderGrid();renderCart();}const it=ITEMS.find(i=>i.id===id);toast("「"+(it?.title||"素材")+"」已添加到购物车");});
$("#cartList").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const id=b.dataset.id;if(b.dataset.act==="toggle"){const it=ITEMS.find(i=>i.id===id);if(it){it.selected=!it.selected;renderCart();}}if(b.dataset.act==="rm"){CART=CART.filter(x=>x!==id);saveCart();renderCart();}});
$("#selAllBtn").addEventListener("click",()=>{const its=ITEMS.filter(i=>CART.includes(i.id));const all=its.every(i=>i.selected);its.forEach(i=>i.selected=!all);renderCart();});
$("#clearCartBtn").addEventListener("click",()=>{if(!CART.length){toast("购物车已为空");return;}if(confirm("确定清空购物车？")){CART=[];ITEMS.forEach(i=>i.selected=false);saveCart();renderCart();}});
$("#dlBtn").addEventListener("click",downloadSelected);
$("#searchInput").addEventListener("input",renderGrid);
updateCartBadge();renderGrid();renderCart();
</script>
</body>
</html>
