<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>素材库 · 轻量版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:15px/1.5 system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);border-bottom:1px solid #e5e5ea}
.header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,#007aff,#af52de);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.header input{flex:1;height:32px;border-radius:16px;border:1px solid #d2d2d7;padding:0 12px;font:inherit;background:#fff}
.tabs{display:flex;justify-content:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);border-bottom:1px solid #e5e5ea}
.tabs button{padding:8px 20px;border-radius:20px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:#e5e5ea;color:#1d1d1f;transition:.2s}
.tabs button.active{background:#007aff;color:#fff;box-shadow:0 2px 8px rgba(0,122,255,.3)}
.tabs button .badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#ff3b30;color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;padding:0 5px}
.pages{flex:1;overflow-y:auto;padding:16px}
.page{display:none}
.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.04);transition:.2s;cursor:default}
.card:active{transform:scale(.97)}
.card img,.card video{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.card .info{padding:10px 12px}
.card .info .title{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .info .desc{font-size:11px;color:#6e6e73;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .info button{margin-top:8px;width:100%;height:30px;border-radius:15px;border:none;font-weight:600;font-size:12px;cursor:pointer;background:#007aff;color:#fff;transition:.2s}
.card .info button.added{background:#34c759}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.cart-item .ck{width:22px;height:22px;border-radius:6px;border:2px solid #d2d2d7;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.cart-item .ck.on{background:#007aff;border-color:#007aff}
.cart-item .ck.on::after{content:'✓';color:#fff;font-size:14px;font-weight:bold}
.cart-item img,.cart-item video{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#eee}
.cart-item .meta{flex:1;min-width:0}
.cart-item .meta .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .meta .d{font-size:11px;color:#6e6e73}
.cart-item .del{background:none;border:none;font-size:18px;cursor:pointer;color:#ff3b30;padding:4px}
.cart-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart-bar span{font-size:13px;color:#6e6e73}
.cart-bar button{padding:6px 14px;border-radius:16px;border:none;font-weight:600;font-size:12px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:#6e6e73}
.empty .ic{font-size:48px;margin-bottom:12px}
.lock-screen{position:fixed;inset:0;background:rgba(245,245,247,.92);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:100}
.lock-card{background:#fff;border-radius:24px;padding:30px 24px;width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.1)}
.lock-card .icon{font-size:42px;margin-bottom:8px}
.lock-card h2{font-size:18px;margin-bottom:4px}
.lock-card p{font-size:12px;color:#6e6e73;margin-bottom:16px}
.dots{display:flex;gap:6px;justify-content:center;min-height:18px;margin-bottom:12px}
.dots span{width:10px;height:10px;border-radius:50%;background:#d2d2d7;transition:.15s}
.dots span.fill{background:#1d1d1f}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:220px;margin:0 auto}
.numpad button{height:48px;border-radius:14px;border:none;font-size:18px;font-weight:600;background:#f0f0f5;cursor:pointer;transition:.1s}
.numpad button:active{background:#ddd;transform:scale(.93)}
.numpad .del{font-size:14px;color:#6e6e73}
.numpad .ok{background:#007aff;color:#fff}
.numpad .ok:active{background:#005bbf}
.lock-hint{font-size:11px;color:#ff3b30;min-height:16px;margin-top:8px}
.dev-panel{padding:16px;background:#fff;border-radius:16px;margin-bottom:12px}
.dev-panel h3{font-size:15px;margin-bottom:4px}
.dev-panel p{font-size:12px;color:#6e6e73;margin-bottom:12px}
.dev-panel input[type=file]{width:100%;padding:8px;border:1px dashed #d2d2d7;border-radius:12px;background:#fafafa;margin-bottom:8px}
.dev-panel .preview-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.dev-panel .preview-item{display:flex;align-items:center;gap:8px;padding:6px;background:#f5f5f7;border-radius:8px}
.dev-panel .preview-item img,.dev-panel .preview-item video{width:40px;height:40px;border-radius:6px;object-fit:cover}
.dev-panel .preview-item .name{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev-panel button{padding:8px 20px;border-radius:20px;border:none;font-weight:600;font-size:13px;cursor:pointer;background:#007aff;color:#fff}
.dev-panel button:active{opacity:.8}
.token-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f0f0f5;border-radius:12px;margin-bottom:8px;font-size:12px;cursor:pointer}
.token-row .label{font-weight:600;white-space:nowrap}
.token-row .code{flex:1;font-family:monospace;color:#6e6e73;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.token-row .copy-btn{padding:4px 12px;border-radius:10px;border:none;background:#007aff;color:#fff;font-size:11px;cursor:pointer}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;padding:12px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>素材库</h1>
  <input type="search" id="searchInput" placeholder="搜索素材…">
</div>

<div class="tabs" id="tabs">
  <button class="active" data-tab="today">Today</button>
  <button data-tab="cart">购物车 <span class="badge" id="cartBadge" hidden>0</span></button>
  <button data-tab="dev">开发者</button>
</div>

<div class="pages">
  <!-- Today -->
  <div class="page active" id="page-today">
    <div class="grid" id="grid"></div>
  </div>
  <!-- Cart -->
  <div class="page" id="page-cart">
    <div class="cart-bar">
      <span id="cartInfo">购物车为空</span>
      <div>
        <button id="selectAllBtn" style="background:#e5e5ea;margin-right:6px">全选</button>
        <button id="clearCartBtn" style="background:#ff3b30;color:#fff">清空</button>
      </div>
    </div>
    <div id="cartList"></div>
  </div>
  <!-- Dev -->
  <div class="page" id="page-dev">
    <div id="devMount"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

// ============ 配置 ============
const CFG = {
  owner: 'YOUR_GITHUB_USER',
  repo: 'YOUR_REPO',
  dataPath: 'data/items.json',
  branch: 'main'
};
const DEV_PWD = '201353440103201305037611';
const TOKEN_KEY = 'ml_gh_token';
const DEFAULT_TOKEN = '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';

let ITEMS = [];
let CART = [];
try { CART = JSON.parse(localStorage.getItem('ml_cart') || '[]'); } catch(e) {}
let SELECTED = {}; // id -> true/false

const $ = s => document.querySelector(s);
const $$
 = s => document.querySelectorAll(s);

function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), ms);
}

function uid() { return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ============ 数据操作 ============
function saveCart() {
  localStorage.setItem('ml_cart', JSON.stringify(CART));
  updateBadge();
}

function updateBadge() {
  const b = $('#cartBadge');
  const n = CART.length;
  b.textContent = n;
  b.hidden = n === 0;
}

async function loadItems() {
  try {
    const url = `https://raw.githubusercontent.com/${CFG.owner}/${CFG.repo}/${CFG.branch}/${CFG.dataPath}?t=${Date.now()}`;
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('fetch fail');
    const data = await resp.json();
    ITEMS = Array.isArray(data?.items) ? data.items : [];
  } catch(e) {
    ITEMS = [];
  }
  // 标准化
  ITEMS = ITEMS.map(it => ({
    ...it,
    type: it.type || 'image',
    src: it.src || it.img || '',
    title: it.title || '未命名',
    desc: it.desc || ''
  }));
  renderGrid();
  renderCart();
}

function getToken() {
  return localStorage.getItem(TOKEN_KEY) || DEFAULT_TOKEN;
}

function setToken(t) {
  if (t) localStorage.setItem(TOKEN_KEY, t);
  else localStorage.removeItem(TOKEN_KEY);
}

async function commitItems(newItems) {
  const token = getToken();
  if (!token) throw new Error('NO_TOKEN');
  // 获取当前文件信息
  const url = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${encodeURI(CFG.dataPath)}`;
  const infoResp = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  const info = await infoResp.json();
  if (!info.sha) throw new Error('NO_SHA');
  const content = btoa(unescape(encodeURIComponent(JSON.stringify({ items: newItems }, null, 2))));
  const putResp = await fetch(url, {
    method: 'PUT',
    headers: {
      Authorization: `Bearer ${token}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: 'update materials',
      content,
      sha: info.sha,
      branch: CFG.branch
    })
  });
  const result = await putResp.json();
  if (!putResp.ok) throw new Error(result.message || 'commit fail');
}

// ============ 渲染 ============
function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  const q = ($('#searchInput').value || '').trim().toLowerCase();
  let list = q ? ITEMS.filter(i => i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)) : ITEMS;
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="ic">🖼️</div><b>${q ? '无匹配素材' : '暂无素材'}</b><p>开发者可在「开发者」页添加</p></div>`;
    return;
  }
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const isVideo = item.type === 'video';
    const media = isVideo ? `<video src="${item.src}" muted loop playsinline preload="metadata"></video>`
                          : `<img src="${item.src}" alt="${item.title}" loading="lazy">`;
    const added = CART.includes(item.id);
    card.innerHTML = `
      ${media}
      <div class="info">
        <div class="title">${item.title}</div>
        <div class="desc">${item.desc}</div>
        <button data-id="${item.id}" class="${added ? 'added' : ''}">${added ? '✓ 已添加' : '加入购物车'}</button>
      </div>
    `;
    grid.appendChild(card);
    // 视频悬停播放
    if (isVideo) {
      const v = card.querySelector('video');
      v.addEventListener('mouseenter', () => v.play());
      v.addEventListener('mouseleave', () => v.pause());
    }
  });
}

function renderCart() {
  const container = $('#cartList');
  container.innerHTML = '';
  const items = ITEMS.filter(i => CART.includes(i.id));
  const selectedCount = items.filter(i => SELECTED[i.id]).length;
  $('#cartInfo').textContent = items.length ? `共 ${items.length} 项 · 已选 ${selectedCount} 项` : '购物车为空';
  if (items.length === 0) {
    container.innerHTML = '<div class="empty"><div class="ic">🛒</div><b>购物车为空</b><p>去 Today 添加喜欢的素材吧</p></div>';
    return;
  }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'cart-item';
    const checked = SELECTED[item.id] || false;
    const isVideo = item.type === 'video';
    const media = isVideo ? `<video src="${item.src}" muted playsinline preload="metadata"></video>`
                          : `<img src="${item.src}" alt="${item.title}">`;
    div.innerHTML = `
      <div class="ck ${checked ? 'on' : ''}" data-id="${item.id}"></div>
      ${media}
      <div class="meta">
        <div class="t">${item.title}${isVideo ? ' ▶' : ''}</div>
        <div class="d">${item.desc}</div>
      </div>
      <button class="del" data-id="${item.id}">✕</button>
    `;
    container.appendChild(div);
  });
}

// ============ 事件绑定 ============

// 分段控制器点击切换
$$('.tabs button').forEach(btn => {
  btn.addEventListener('click', function() {
    const tab = this.dataset.tab;
    $$
('.tabs button').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    $$('.page').forEach(p => p.classList.remove('active'));
    $(`#page-${tab}`).classList.add('active');
  });
});

// 搜索
$('#searchInput').addEventListener('input', renderGrid);

// 网格加入购物车
$('#grid').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!CART.includes(id)) {
    CART.push(id);
    SELECTED[id] = false;
    saveCart();
    renderGrid();
    renderCart();
    const item = ITEMS.find(i => i.id === id);
    toast(`「${item?.title || '素材'}」已加入购物车`);
  }
});

// 购物车内操作
$('#cartList').addEventListener('click', e => {
  const target = e.target;
  if (target.classList.contains('ck')) {
    const id = target.dataset.id;
    SELECTED[id] = !SELECTED[id];
    renderCart();
  } else if (target.classList.contains('del')) {
    const id = target.dataset.id;
    CART = CART.filter(x => x !== id);
    delete SELECTED[id];
    saveCart();
    renderCart();
    renderGrid();
  }
});

// 全选
$('#selectAllBtn').addEventListener('click', () => {
  const items = ITEMS.filter(i => CART.includes(i.id));
  const allSelected = items.every(i => SELECTED[i.id]);
  items.forEach(i => SELECTED[i.id] = !allSelected);
  renderCart();
});

// 清空
$('#clearCartBtn').addEventListener('click', () => {
  if (!CART.length) return;
  if (confirm('确定清空购物车？')) {
    CART = [];
    SELECTED = {};
    saveCart();
    renderCart();
    renderGrid();
  }
});

// ============ 开发者模块 ============
let devUnlocked = false;

function showDevLock() {
  $('#devMount').innerHTML = `
    <div class="lock-screen" id="lockScreen">
      <div class="lock-card">
        <div class="icon">🔒</div>
        <h2>开发者安全验证</h2>
        <p>请输入24位安全密码以管理素材库</p>
        <div class="dots" id="lockDots"></div>
        <div class="numpad" id="lockNumPad"></div>
        <div class="lock-hint" id="lockHint"></div>
      </div>
    </div>
  `;
  let pwd = '';
  const dotsEl = $('#lockDots');
  const hintEl = $('#lockHint');
  const pad = $('#lockNumPad');

  function renderDots() {
    dotsEl.innerHTML = Array.from({ length: 24 }, (_, i) =>
      `<span class="${i < pwd.length ? 'fill' : ''}"></span>`
    ).join('');
  }

  function checkPwd() {
    if (pwd.length === 24) {
      if (pwd === DEV_PWD) {
        devUnlocked = true;
        localStorage.setItem('ml_dev_unlock', '1');
        showDevPanel();
      } else {
        hintEl.textContent = '密码错误，请重试';
        pwd = '';
        renderDots();
      }
    }
  }

  pad.addEventListener('click', e => {
    const key = e.target.closest('button');
    if (!key) return;
    const val = key.dataset.value;
    if (val === 'del') {
      pwd = pwd.slice(0, -1);
    } else if (val === 'ok') {
      // 手动确认
      if (pwd === DEV_PWD) {
        devUnlocked = true;
        localStorage.setItem('ml_dev_unlock', '1');
        showDevPanel();
      } else {
        hintEl.textContent = '密码错误';
        pwd = '';
      }
    } else if (pwd.length < 24) {
      pwd += val;
    }
    renderDots();
    // 自动检测满24位
    if (pwd.length === 24) checkPwd();
  });

  // 物理键盘支持
  const handler = e => {
    if (e.key >= '0' && e.key <= '9' && pwd.length < 24) {
      pwd += e.key;
      renderDots();
      if (pwd.length === 24) checkPwd();
    } else if (e.key === 'Backspace') {
      pwd = pwd.slice(0, -1);
      renderDots();
    } else if (e.key === 'Enter') {
      if (pwd === DEV_PWD) {
        devUnlocked = true;
        localStorage.setItem('ml_dev_unlock', '1');
        showDevPanel();
      } else {
        hintEl.textContent = '密码错误';
        pwd = '';
        renderDots();
      }
    }
  };
  window.addEventListener('keydown', handler);
  // 清理
  const cleanup = () => window.removeEventListener('keydown', handler);
  // 在显示面板时清理
  window._devCleanup = cleanup;

  renderDots();
  // 生成数字键盘
  pad.innerHTML = `
    <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
    <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
    <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
    <button data-value="del" class="del">⌫</button><button data-value="0">0</button><button data-value="ok" class="ok">OK</button>
  `;
}

function showDevPanel() {
  if (window._devCleanup) window._devCleanup();
  const token = getToken();
  const masked = token ? token.slice(0,4) + '•••' + token.slice(-6) : '未配置';
  const itemsHtml = ITEMS.map(it => `
    <div class="preview-item">
      ${it.type === 'video' ? `<video src="${it.src}" muted playsinline></video>` : `<img src="${it.src}">`}
      <span class="name">${it.title}</span>
      <button class="del-item" data-id="${it.id}" style="background:#ff3b30;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer">删除</button>
    </div>
  `).join('') || '<p style="color:#6e6e73">暂无素材</p>';

  $('#devMount').innerHTML = `
    <div class="dev-panel">
      <h3>✅ 已解锁开发者模式</h3>
      <p>发布/删除会写入仓库 data/items.json，全员刷新可见。</p>
    </div>
    <div class="dev-panel">
      <h3>➕ 添加素材</h3>
      <p>可一次选择多张图片/视频，批量发布。</p>
      <input type="file" id="addFile" accept="image/*,video/*" multiple>
      <div class="preview-list" id="previewList"></div>
      <button id="publishBtn">批量发布到素材库</button>
      <div style="font-size:11px;color:#6e6e73;margin-top:6px">文件会转为base64嵌入数据文件，建议控制大小。</div>
    </div>
    <div class="dev-panel">
      <h3>📦 已发布素材 (${ITEMS.length})</h3>
      <div id="existingList">${itemsHtml}</div>
    </div>
    <div class="dev-panel">
      <h3>🔑 仓库同步设置</h3>
      <p>需要含 repo 权限的 Personal Access Token。</p>
      <div class="token-row" id="tokenRow">
        <span class="label">TOKEN</span>
        <span class="code" id="tokenDisplay">${masked}</span>
        <button class="copy-btn" id="copyTokenBtn">复制</button>
      </div>
      <input type="password" id="tokenInput" placeholder="ghp_..." value="${token || ''}" style="width:100%;padding:8px 12px;border:1px solid #d2d2d7;border-radius:12px;margin-bottom:8px">
      <button id="saveTokenBtn" style="background:#007aff;color:#fff;border:none;padding:8px 20px;border-radius:20px;font-weight:600;cursor:pointer">保存Token</button>
      <button id="clearTokenBtn" style="background:#e5e5ea;border:none;padding:8px 20px;border-radius:20px;margin-left:6px;cursor:pointer">清除</button>
    </div>
  `;

  // 绑定事件
  // 复制Token
  $('#copyTokenBtn').addEventListener('click', () => {
    const t = getToken();
    navigator.clipboard.writeText(t).then(() => toast('Token已复制')).catch(() => toast('复制失败'));
  });
  // 保存Token
  $('#saveTokenBtn').addEventListener('click', () => {
    const val = $('#tokenInput').value.trim();
    if (val) {
      setToken(val);
      toast('Token已保存');
      $('#tokenDisplay').textContent = val.slice(0,4) + '•••' + val.slice(-6);
    }
  });
  // 清除Token
  $('#clearTokenBtn').addEventListener('click', () => {
    setToken('');
    $('#tokenInput').value = '';
    $('#tokenDisplay').textContent = '未配置';
    toast('Token已清除');
  });

  // 文件预览
  $('#addFile').addEventListener('change', function() {
    const files = Array.from(this.files);
    const container = $('#previewList');
    container.innerHTML = '';
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        const isVid = file.type.startsWith('video/');
        const src = e.target.result;
        div.innerHTML = `
          ${isVid ? `<video src="${src}" muted playsinline></video>` : `<img src="${src}">`}
          <span class="name">${file.name}</span>
          <span style="font-size:10px;color:#6e6e73">${(file.size/1024).toFixed(0)}KB</span>
        `;
        container.appendChild(div);
      };
      reader.readAsDataURL(file);
    });
  });

  // 发布
  $('#publishBtn').addEventListener('click', async () => {
    const fileInput = $('#addFile');
    const files = fileInput.files;
    if (!files.length) { toast('请选择文件'); return; }
    const newItems = [];
    for (let file of files) {
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
      const isVideo = file.type.startsWith('video/');
      const name = file.name.replace(/\.[^.]+$/, '');
      newItems.push({
        id: uid(),
        type: isVideo ? 'video' : 'image',
        src: dataUrl,
        title: name,
        desc: ''
      });
    }
    // 合并现有items
    const updated = [...ITEMS, ...newItems];
    try {
      await commitItems(updated);
      ITEMS = updated;
      toast('发布成功！刷新页面可见');
      renderGrid();
      renderCart();
      showDevPanel(); // 刷新面板
    } catch(e) {
      toast('发布失败: ' + (e.message || '未知错误'));
    }
  });

  // 删除已有素材
  $('#existingList').addEventListener('click', async e => {
    const btn = e.target.closest('.del-item');
    if (!btn) return;
    const id = btn.dataset.id;
    if (!confirm('确定删除此素材？')) return;
    const updated = ITEMS.filter(i => i.id !== id);
    try {
      await commitItems(updated);
      ITEMS = updated;
      toast('删除成功');
      renderGrid();
      renderCart();
      showDevPanel();
    } catch(e) {
      toast('删除失败: ' + (e.message || '未知错误'));
    }
  });
}

// 初始化开发者页面
function initDev() {
  if (localStorage.getItem('ml_dev_unlock') === '1') {
    devUnlocked = true;
    showDevPanel();
  } else {
    showDevLock();
  }
}

// ============ 启动 ============
updateBadge();
loadItems();
initDev();

</script>
</body>
</html>
